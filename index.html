<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Assistant</title>
    <style>
        body {
            margin: 0;
            background-color: #050510;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: cyan;
        }
        .jarvis-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        .ring {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.5);
            animation: rotate 10s linear infinite;
        }
        .ring:nth-child(2) {
            border: 3px dashed rgba(255, 165, 0, 0.6);
            box-shadow: 0 0 30px rgba(255, 165, 0, 0.8);
            animation: rotate-reverse 8s linear infinite;
            transform: scale(0.8);
        }
        .ring:nth-child(3) {
            border: 2px dotted rgba(0, 255, 255, 0.8);
            animation: rotate 6s linear infinite;
            transform: scale(0.6);
        }
        .core {
            position: absolute;
            top: 50%; left: 50%;
            width: 80px; height: 80px;
            background: radial-gradient(circle, #fff, cyan, transparent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 50px cyan;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes rotate-reverse { 100% { transform: scale(0.8) rotate(-360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
        
        .text-box {
            position: absolute;
            bottom: 10%;
            width: 80%;
            text-align: center;
        }
        input {
            width: 70%;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid cyan;
            background: transparent;
            color: cyan;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="jarvis-container">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="core"></div>
        <div class="text-box">
            <input type="text" id="userInput" placeholder="Ask Max..." />
        </div>
    </div>

    <script>
        // यहाँ आगे चलकर AI API का कोड आएगा
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                alert("Max is thinking... (API will be connected soon)");
            }
        });
    </script>
</body>
  </html>
